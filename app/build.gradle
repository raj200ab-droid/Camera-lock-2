plugins {
    id 'com.android.application'
}

android {
    namespace 'com.privacy.camerablocker'
    compileSdk 33

    defaultConfig {
        applicationId "com.privacy.camerablocker"
        minSdk 21
        targetSdk 28 // Target 28 dewa hoyeche camera block API kaj korar jonno
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
